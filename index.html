<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đại Chiến Tướng Lĩnh 3D - Trung Ý vs Trung Thành</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
  canvas#view { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; top: 12px; left: 12px; color: #fff; background: rgba(15,23,42,0.85); padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; pointer-events: none; border: 1px solid rgba(255,204,0,0.35); z-index: 10; }
  #skills { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; pointer-events: none; }
  .sk { background: rgba(15,23,42,0.9); border: 2px solid #f59e0b; color: #fff; padding: 8px 12px; border-radius: 10px; text-align: center; font-size: 12px; min-width: 85px; }
  .sk b { display: block; color: #facc15; font-size: 14px; }
  #crosshair { position: fixed; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%); pointer-events: none; z-index: 10; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ffcc00; box-shadow: 0 0 6px #ff5252; }
  #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
  #crosshair::after { left: 8px; top: 0; width: 2px; height: 18px; }
  #minimap { position: fixed; bottom: 15px; right: 15px; border: 2px solid #f59e0b; border-radius: 8px; background: rgba(0,0,0,0.85); z-index: 10; }
  #winScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; flex-direction: column; color: #fff; z-index: 50; }
  #winScreen button { margin-top: 15px; padding: 14px 36px; font-size: 17px; background: linear-gradient(135deg,#facc15,#f97316); border: none; border-radius: 30px; cursor: pointer; font-weight: bold; color: #111; }
</style>
</head>
<body>
<div id="hud">
  <div style="color:#facc15;font-weight:bold;font-size:15px">🔥 ĐẠI CHIẾN TƯỚNG LĨNH 3D</div>
  <div>Máu Tướng Bạn: <span id="pHp" style="color:#4ade80;font-weight:bold">500</span> | Vàng: <span id="gold" style="color:#facc15;font-weight:bold">0</span> 💰</div>
  <div>Đại Tướng Địch: <span id="eGenHp" style="color:#60a5fa;font-weight:bold">600</span> 👑</div>
  <div>Nhà chính Đỏ: <span id="bRed" style="color:#f87171;font-weight:bold">100%</span> | Xanh: <span id="bBlue" style="color:#60a5fa;font-weight:bold">100%</span></div>
  <div style="font-size:11px;color:#cbd5e1;margin-top:4px">[1] Nâng Kiếm (50💰) | [2] Nâng Máu (50💰) | [E] Gọi quân hộ giá</div>
</div>
<div id="skills">
  <div class="sk"><b>Chuột Trái</b>Chém Lửa</div>
  <div class="sk"><b id="cdQ">[Q] Sẵn sàng</b>Sóng Kiếm</div>
  <div class="sk"><b id="cdShift">[Shift] Sẵn sàng</b>Tốc Biến</div>
  <div class="sk"><b id="cdF">[F] Sẵn sàng</b>Hồi Máu</div>
</div>
<div id="crosshair"></div>
<canvas id="minimap" width="160" height="120"></canvas>
<div id="winScreen"><h1 id="winText"></h1><button onclick="location.reload()">TÁI CHIẾN</button></div>
<canvas id="view"></canvas>
<script>
const cvs = document.getElementById('view'), ctx = cvs.getContext('2d');
const mCtx = document.getElementById('minimap').getContext('2d');
function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const RAW_MAP = [
  "1111111111111111",
  "1000000110000001",
  "1020000000000301",
  "1000000110000001",
  "1000110110110001",
  "1000000000000001",
  "1000000000000001",
  "1000110110110001",
  "1000000110000001",
  "1000000000000001",
  "1000000110000001",
  "1111111111111111"
];
const MAP = RAW_MAP.map(r => r.split('').map(Number));
const MW = 16, MH = 12;
const player = { x: 3.5, y: 2.5, dir: 0, hp: 500, maxHp: 500, dmg: 55, gold: 0, swing: 0, cd: 0, qCd: 0, sCd: 0, fCd: 0, healGlow: 0 };
const bases = { red: { x: 2.5, y: 2.5, hp: 1200, max: 1200 }, blue: { x: 13.5, y: 2.5, hp: 1200, max: 1200 } };
const entities = [], projectiles = [], particles = [], floatTexts = [];

// Khởi tạo Đại Tướng Địch siêu mạnh (600 HP + Kỹ năng)
entities.push({ type: 'general', team: 'blue', x: 12.5, y: 2.5, hp: 600, maxHp: 600, cd: 0, skillCd: 3.0 });

function spawnUnit(team, role) {
  if (entities.filter(e => e.team === team && e.type !== 'general').length >= 16) return;
  const bx = team === 'red' ? 3.5 : 12.5;
  const by = 2.5 + (Math.random() - 0.5) * 3;
  entities.push({
    type: role, team, x: bx, y: by,
    hp: role === 'archer' ? 50 : 75, maxHp: role === 'archer' ? 50 : 75,
    cd: 0, follow: false
  });
}
for (let i = 0; i < 5; i++) { spawnUnit('red', 'soldier'); spawnUnit('blue', 'soldier'); }
for (let i = 0; i < 3; i++) { spawnUnit('red', 'archer'); spawnUnit('blue', 'archer'); }

function addFx(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: 0.4 });
  }
}
function addDmgText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 0.7 });
}
function canMove(nx, ny) {
  const gx = Math.floor(nx), gy = Math.floor(ny);
  return gy >= 0 && gy < MH && gx >= 0 && gx < MW && MAP[gy][gx] === 0;
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') meleeAttack();
  if (e.code === 'KeyQ') castWave();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') castDash();
  if (e.code === 'KeyF') castHeal();
  if (e.code === 'KeyE') entities.forEach(en => { if (en.team === 'red') en.follow = !en.follow; });
  if (e.code === 'Digit1' && player.gold >= 50) { player.gold -= 50; player.dmg += 20; addDmgText(player.x, player.y, "+20 Sát thương!", "#facc15"); }
  if (e.code === 'Digit2' && player.gold >= 50) { player.gold -= 50; player.maxHp += 100; player.hp += 100; addDmgText(player.x, player.y, "+100 Máu tối đa!", "#4ade80"); }
});
window.addEventListener('keyup', e => keys[e.code] = false);
cvs.addEventListener('click', () => { if (document.pointerLockElement !== cvs) cvs.requestPointerLock(); meleeAttack(); });
window.addEventListener('mousemove', e => { if (document.pointerLockElement === cvs) player.dir += e.movementX * 0.003; });

function meleeAttack() {
  if (player.cd > 0 || over) return;
  player.swing = 1.0; player.cd = 0.35;
  entities.forEach(e => {
    if (e.team === 'blue') {
      const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
      const diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - player.dir), Math.cos(Math.atan2(dy, dx) - player.dir));
      if (d < 2.5 && Math.abs(diff) < 0.75) {
        e.hp -= player.dmg;
        addFx(e.x, e.y, '#f97316', 10);
        addDmgText(e.x, e.y, `-${player.dmg}`, '#facc15');
        if (e.hp <= 0) player.gold += (e.type === 'general' ? 200 : 15);
      }
    }
  });
  if (Math.hypot(bases.blue.x - player.x, bases.blue.y - player.y) < 2.8) {
    bases.blue.hp = Math.max(0, bases.blue.hp - player.dmg);
    addFx(bases.blue.x, bases.blue.y, '#ef4444', 10);
  }
}

function castWave() {
  if (player.qCd > 0 || over) return;
  player.qCd = 4.0; player.swing = 1.0;
  projectiles.push({ team: 'red', type: 'wave', x: player.x, y: player.y, vx: Math.cos(player.dir) * 11, vy: Math.sin(player.dir) * 11, dmg: player.dmg * 1.6, life: 1.2 });
}

function castDash() {
  if (player.sCd > 0 || over) return;
  player.sCd = 3.0;
  for (let i = 0; i < 6; i++) {
    const nx = player.x + Math.cos(player.dir) * 0.45, ny = player.y + Math.sin(player.dir) * 0.45;
    if (canMove(nx, ny)) { player.x = nx; player.y = ny; }
  }
  addFx(player.x, player.y, '#38bdf8', 12);
}

function castHeal() {
  if (player.fCd > 0 || over) return;
  player.fCd = 8.0; player.healGlow = 0.6;
  player.hp = Math.min(player.maxHp, player.hp + 150);
  addDmgText(player.x, player.y, "+150 HP", "#4ade80");
}
let spawnTimer = 0, over = false, last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const W = cvs.width, H = cvs.height;

  if (!over) {
    if (keys['ArrowLeft']) player.dir -= 2.3 * dt;
    if (keys['ArrowRight']) player.dir += 2.3 * dt;
    let mx = 0, my = 0, spd = 4.6 * dt;
    if (keys['KeyW']) { mx += Math.cos(player.dir) * spd; my += Math.sin(player.dir) * spd; }
    if (keys['KeyS']) { mx -= Math.cos(player.dir) * spd; my -= Math.sin(player.dir) * spd; }
    if (keys['KeyA']) { mx += Math.sin(player.dir) * spd; my -= Math.cos(player.dir) * spd; }
    if (keys['KeyD']) { mx -= Math.sin(player.dir) * spd; my += Math.cos(player.dir) * spd; }
    if (canMove(player.x + mx, player.y)) player.x += mx;
    if (canMove(player.x, player.y + my)) player.y += my;

    player.cd = Math.max(0, player.cd - dt);
    player.qCd = Math.max(0, player.qCd - dt);
    player.sCd = Math.max(0, player.sCd - dt);
    player.fCd = Math.max(0, player.fCd - dt);
    player.swing = Math.max(0, player.swing - dt * 4);
    player.healGlow = Math.max(0, player.healGlow - dt);

    spawnTimer += dt;
    if (spawnTimer >= 4.5) {
      spawnTimer = 0;
      spawnUnit('red', 'soldier'); spawnUnit('blue', 'soldier');
      if (Math.random() < 0.5) { spawnUnit('red', 'archer'); spawnUnit('blue', 'archer'); }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i]; p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (!canMove(p.x, p.y) || p.life <= 0) { projectiles.splice(i, 1); continue; }

      if (p.team === 'red') {
        entities.forEach(e => {
          if (e.team === 'blue' && Math.hypot(e.x - p.x, e.y - p.y) < 0.8) {
            e.hp -= p.dmg; addFx(e.x, e.y, '#facc15', 8); addDmgText(e.x, e.y, `-${Math.round(p.dmg)}`, '#fb923c');
            if (e.hp <= 0) player.gold += (e.type === 'general' ? 200 : 15);
            if (p.type !== 'wave') p.life = 0;
          }
        });
      } else {
        if (Math.hypot(player.x - p.x, player.y - p.y) < 0.7) {
          player.hp -= p.dmg; addFx(player.x, player.y, '#ef4444', 6); p.life = 0;
        }
        entities.forEach(e => {
          if (e.team === 'red' && Math.hypot(e.x - p.x, e.y - p.y) < 0.7) { e.hp -= p.dmg; p.life = 0; }
        });
      }
    }

    entities.forEach(e => {
      e.cd = Math.max(0, e.cd - dt);
      let tx = e.team === 'red' ? bases.blue.x : bases.red.x;
      let ty = e.team === 'red' ? bases.blue.y : bases.red.y;
      if (e.team === 'red' && e.follow) { tx = player.x; ty = player.y; }

      let target = null, minD = Infinity;
      entities.forEach(o => {
        if (o.team !== e.team) {
          const d = Math.hypot(o.x - e.x, o.y - e.y);
          if (d < minD) { minD = d; target = o; }
        }
      });
      if (e.team === 'blue') {
        const dp = Math.hypot(player.x - e.x, player.y - e.y);
        if (dp < minD || e.type === 'general') { minD = dp; target = player; }
      }

      if (e.type === 'general') {
        e.skillCd = Math.max(0, e.skillCd - dt);
        if (e.skillCd <= 0 && target && minD < 7) {
          e.skillCd = 4.5;
          const a = Math.atan2(target.y - e.y, target.x - e.x);
          projectiles.push({ team: 'blue', type: 'wave', x: e.x, y: e.y, vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, dmg: 55, life: 1.0 });
        }
      }

      const atkRange = e.type === 'archer' ? 5.5 : 1.4;
      if (target && minD <= atkRange) {
        if (e.cd <= 0) {
          e.cd = e.type === 'general' ? 0.85 : 1.1;
          if (e.type === 'archer') {
            const a = Math.atan2(target.y - e.y, target.x - e.x);
            projectiles.push({ team: e.team, type: 'arrow', x: e.x, y: e.y, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, dmg: 14, life: 0.9 });
          } else {
            target.hp -= (e.type === 'general' ? 35 : 12);
            addFx(target.x, target.y, '#ef4444', 5);
          }
        }
      } else if (Math.hypot(tx - e.x, ty - e.y) < 1.8 && !e.follow) {
        if (e.cd <= 0) {
          e.cd = 1.0;
          if (e.team === 'red') bases.blue.hp = Math.max(0, bases.blue.hp - 18);
          else bases.red.hp = Math.max(0, bases.red.hp - 18);
        }
      } else {
        const gx = (target && minD < 6) ? target.x : tx;
        const gy = (target && minD < 6) ? target.y : ty;
        const ang = Math.atan2(gy - e.y, gx - e.x);
        const moveSpd = (e.type === 'general' ? 3.2 : 2.3) * dt;
        const vx = Math.cos(ang) * moveSpd, vy = Math.sin(ang) * moveSpd;
        if (canMove(e.x + vx, e.y)) e.x += vx;
        if (canMove(e.x, e.y + vy)) e.y += vy;
      }
    });
    for (let i = entities.length - 1; i >= 0; i--) if (entities[i].hp <= 0) entities.splice(i, 1);
    for (let i = particles.length - 1; i >= 0; i--) { particles[i].x += particles[i].vx * dt; particles[i].y += particles[i].vy * dt; particles[i].life -= dt; if (particles[i].life <= 0) particles.splice(i, 1); }
    for (let i = floatTexts.length - 1; i >= 0; i--) { floatTexts[i].life -= dt; if (floatTexts[i].life <= 0) floatTexts.splice(i, 1); }

    const eGen = entities.find(e => e.type === 'general');
    document.getElementById('pHp').textContent = Math.max(0, Math.ceil(player.hp));
    document.getElementById('gold').textContent = player.gold;
    document.getElementById('eGenHp').textContent = eGen ? Math.ceil(eGen.hp) : 'ĐÃ BỊ HẠ!';
    document.getElementById('bRed').textContent = Math.ceil((bases.red.hp / bases.red.max) * 100) + '%';
    document.getElementById('bBlue').textContent = Math.ceil((bases.blue.hp / bases.blue.max) * 100) + '%';
    document.getElementById('cdQ').textContent = player.qCd > 0 ? player.qCd.toFixed(1) + 's' : '[Q] Sẵn sàng';
    document.getElementById('cdShift').textContent = player.sCd > 0 ? player.sCd.toFixed(1) + 's' : '[Shift] Sẵn sàng';
    document.getElementById('cdF').textContent = player.fCd > 0 ? player.fCd.toFixed(1) + 's' : '[F] Sẵn sàng';

    if (player.hp <= 0 || bases.red.hp <= 0 || bases.blue.hp <= 0) {
      over = true; document.getElementById('winScreen').style.display = 'flex';
      document.getElementById('winText').textContent = bases.blue.hp <= 0 ? '🏆 TRUNG Ý ĐẠI THẮNG!' : '💀 BẠN ĐÃ TỬ TRẬN!';
    }
  }

  const sky = ctx.createLinearGradient(0, 0, 0, H / 2);
  sky.addColorStop(0, '#1e3a8a'); sky.addColorStop(1, '#f97316');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H / 2);
  ctx.fillStyle = '#2e4d12'; ctx.fillRect(0, H / 2, W, H / 2);

  const FOV = Math.PI / 3, zBuf = new Float32Array(W);
  for (let x = 0; x < W; x += 2) {
    const rayAng = (player.dir - FOV / 2) + (x / W) * FOV;
    const rx = Math.cos(rayAng), ry = Math.sin(rayAng);
    let dist = 0, hit = 0;
    while (hit === 0 && dist < 20) {
      dist += 0.05;
      const hx = player.x + rx * dist, hy = player.y + ry * dist;
      const tx = Math.floor(hx), ty = Math.floor(hy);
      if (ty < 0 || ty >= MH || tx < 0 || tx >= MW) hit = 1;
      else if (MAP[ty][tx] > 0) hit = MAP[ty][tx];
    }
    const perp = dist * Math.cos(rayAng - player.dir);
    zBuf[x] = zBuf[x + 1] = perp;
    const wallH = Math.min(H, H / perp);
    const shade = Math.max(0.25, 1 - perp / 18);
    const stripe = (Math.floor((player.x + rx * dist) * 4) + Math.floor((player.y + ry * dist) * 4)) % 2 === 0 ? 1 : 0.88;
    ctx.fillStyle = hit === 2 ? `rgb(${230*shade},40,40)` : hit === 3 ? `rgb(40,110,${240*shade})` : `rgb(${115*shade*stripe},${120*shade*stripe},${105*shade*stripe})`;
    ctx.fillRect(x, (H - wallH) / 2, 2, wallH);
  }

  const allSprites = [
    ...entities.map(e => ({ kind: 'unit', ...e })),
    ...projectiles.map(p => ({ kind: 'proj', ...p })),
    ...particles.map(pt => ({ kind: 'part', ...pt })),
    ...floatTexts.map(ft => ({ kind: 'text', ...ft }))
  ].map(s => {
    const dx = s.x - player.x, dy = s.y - player.y;
    return { ...s, dist: Math.hypot(dx, dy), ang: Math.atan2(dy, dx) - player.dir };
  }).sort((a, b) => b.dist - a.dist);

  allSprites.forEach(s => {
    const diff = Math.atan2(Math.sin(s.ang), Math.cos(s.ang));
    if (Math.abs(diff) < FOV * 0.7 && s.dist > 0.3) {
      const sx = (0.5 + diff / FOV) * W, ix = Math.floor(sx);
      if (ix < 0 || ix >= W || s.dist >= zBuf[ix]) return;
      const scale = H / s.dist;

      if (s.kind === 'unit') {
        const h = scale * (s.type === 'general' ? 1.05 : 0.65), w = h * 0.55;
        ctx.fillStyle = s.team === 'red' ? '#ef4444' : '#2563eb';
        ctx.fillRect(sx - w / 2, H / 2 - h * 0.2, w, h * 0.75);
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(sx, H / 2 - h * 0.35, w * 0.36, 0, Math.PI * 2); ctx.fill();
        if (s.type === 'general') {
          ctx.fillStyle = '#facc15'; ctx.fillRect(sx - w * 0.3, H / 2 - h * 0.6, w * 0.6, h * 0.12);
        } else if (s.type === 'archer') {
          ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx + w * 0.4, H / 2, h * 0.25, -1.2, 1.2); ctx.stroke();
        }
        ctx.fillStyle = '#000'; ctx.fillRect(sx - w / 2, H / 2 - h * 0.72, w, 5);
        ctx.fillStyle = '#4ade80'; ctx.fillRect(sx - w / 2, H / 2 - h * 0.72, w * (s.hp / s.maxHp), 5);
      } else if (s.kind === 'proj') {
        ctx.fillStyle = s.type === 'wave' ? (s.team === 'red' ? '#facc15' : '#38bdf8') : '#fff';
        const r = scale * (s.type === 'wave' ? 0.25 : 0.06);
        ctx.beginPath(); ctx.arc(sx, H / 2, r, 0, Math.PI * 2); ctx.fill();
      } else if (s.kind === 'part') {
        ctx.fillStyle = s.color; ctx.fillRect(sx, H / 2, scale * 0.05, scale * 0.05);
      } else if (s.kind === 'text') {
        ctx.fillStyle = s.color; ctx.font = 'bold 18px sans-serif'; ctx.fillText(s.text, sx - 20, H / 2 - scale * 0.4);
      }
    }
  });

  if (player.healGlow > 0) { ctx.fillStyle = `rgba(74,222,128,${player.healGlow * 0.4})`; ctx.fillRect(0, 0, W, H); }
  ctx.save();
  ctx.translate(W * 0.73, H * 0.86);
  ctx.rotate(-0.35 - player.swing * 1.15);
  ctx.shadowColor = '#f97316'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(-10, -250, 20, 230);
  ctx.fillStyle = '#f59e0b'; ctx.fillRect(-38, -30, 76, 15);
  ctx.fillStyle = '#7c2d12'; ctx.fillRect(-10, -15, 20, 65);
  ctx.restore();

  mCtx.clearRect(0, 0, 160, 120);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    mCtx.fillStyle = MAP[y][x] === 2 ? '#ef4444' : MAP[y][x] === 3 ? '#3b82f6' : MAP[y][x] === 1 ? '#64748b' : '#1e293b';
    mCtx.fillRect(x * 10, y * 10, 10, 10);
  }
  entities.forEach(e => {
    mCtx.fillStyle = e.type === 'general' ? '#38bdf8' : e.team === 'red' ? '#f87171' : '#60a5fa';
    mCtx.beginPath(); mCtx.arc(e.x * 10, e.y * 10, e.type === 'general' ? 4.5 : 2.5, 0, Math.PI * 2); mCtx.fill();
  });
  mCtx.fillStyle = '#facc15'; mCtx.beginPath(); mCtx.arc(player.x * 10, player.y * 10, 4.5, 0, Math.PI * 2); mCtx.fill();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
